<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 4 / 3;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #canvas {
            display: none;
        }

        #overlay {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 0 20px;
            z-index: 10;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid white;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .btn:active {
            transform: scale(0.88);
            background: rgba(255,255,255,0.3);
        }

        .btn-capture {
            width: 80px;
            height: 80px;
            border: 5px solid white;
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-capture::after {
            content: '';
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            transition: background 0.2s;
        }

        .btn-capture:active::after {
            background: #ccc;
        }

        .btn-switch {
            font-size: 24px;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            z-index: 10;
            white-space: nowrap;
        }

        /* Flash effect */
        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.1s;
        }

        #flash.active {
            opacity: 0.6;
            transition: opacity 0s;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Video feed -->
    <video id="video" autoplay playsinline></video>
    
    <!-- Hidden canvas for capturing -->
    <canvas id="canvas"></canvas>

    <!-- Flash overlay -->
    <div id="flash"></div>

    <!-- Status message -->
    <div id="status">📷 Camera ready</div>

    <!-- Controls -->
    <div id="overlay">
        <button class="btn btn-switch" id="btnSwitch" title="Switch Camera">🔄</button>
        <button class="btn btn-capture" id="btnCapture" title="Capture"></button>
        <button class="btn btn-switch" id="btnDownload" title="Download last photo">💾</button>
    </div>
</div>

<script>
    (function() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const flash = document.getElementById('flash');
        const statusEl = document.getElementById('status');
        const btnCapture = document.getElementById('btnCapture');
        const btnSwitch = document.getElementById('btnSwitch');
        const btnDownload = document.getElementById('btnDownload');

        let stream = null;
        let facingMode = 'environment'; // 'environment' or 'user'
        let lastPhotoDataURL = null;

        // --- Start camera ---
        async function startCamera(facing = 'environment') {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }

                const constraints = {
                    video: {
                        facingMode: facing,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                statusEl.textContent = '✅ Camera on';
                return true;
            } catch (err) {
                console.error('Camera error:', err);
                statusEl.textContent = '❌ Camera unavailable';
                
                if (err.name === 'NotAllowedError') {
                    statusEl.textContent = '⚠️ Permission denied';
                } else if (err.name === 'OverconstrainedError') {
                    // Fallback: try with basic constraints
                    try {
                        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        stream = fallbackStream;
                        video.srcObject = stream;
                        await video.play();
                        statusEl.textContent = '✅ Camera on (fallback)';
                        return true;
                    } catch (fallbackErr) {
                        statusEl.textContent = '❌ No camera found';
                    }
                }
                return false;
            }
        }

        // --- Capture photo ---
        function capturePhoto() {
            if (!stream || !video.videoWidth) {
                statusEl.textContent = '⚠️ No video feed';
                return;
            }

            // Set canvas size to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Draw current video frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Save as data URL (JPEG)
            lastPhotoDataURL = canvas.toDataURL('image/jpeg', 0.95);

            // Flash effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 150);

            statusEl.textContent = '📸 Photo captured!';
            setTimeout(() => {
                statusEl.textContent = '✅ Camera ready';
            }, 1500);

            // Auto-download (optional — comment out if you prefer manual)
            // downloadPhoto();
        }

        // --- Download last photo ---
        function downloadPhoto() {
            if (!lastPhotoDataURL) {
                statusEl.textContent = '⚠️ No photo to download';
                setTimeout(() => {
                    statusEl.textContent = '✅ Camera ready';
                }, 1000);
                return;
            }

            const link = document.createElement('a');
            link.download = `photo_${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`;
            link.href = lastPhotoDataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            statusEl.textContent = '💾 Download started';
            setTimeout(() => {
                statusEl.textContent = '✅ Camera ready';
            }, 1000);
        }

        // --- Switch camera ---
        function switchCamera() {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            statusEl.textContent = '🔄 Switching...';
            startCamera(facingMode);
        }

        // --- Event listeners ---
        btnCapture.addEventListener('click', capturePhoto);
        btnSwitch.addEventListener('click', switchCamera);
        btnDownload.addEventListener('click', downloadPhoto);

        // Keyboard shortcuts (for desktop testing)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                capturePhoto();
            }
            if (e.key === 's' || e.key === 'S') {
                downloadPhoto();
            }
            if (e.key === 'c' || e.key === 'C') {
                switchCamera();
            }
        });

        // --- Start with back camera ---
        startCamera('environment');

        // --- Clean up on page unload ---
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        // --- Handle visibility change to restart if needed ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Pause? Nothing needed, but we can keep stream alive
            } else {
                // If video is paused, try to resume
                if (video.paused && stream) {
                    video.play().catch(() => {});
                }
            }
        });

    })();
</script>

</body>
</html>
